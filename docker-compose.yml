name: archive-451-cms

services:
  main-db:
    image: postgres
    ports:
      - 5433:5432 # 5432 занят нативным Postgres (EnterpriseDB), см. /Library/LaunchDaemons/postgresql-17.plist
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - main-db:/var/lib/postgresql
  minio:
    image: quay.io/minio/minio:latest
    entrypoint: sh
    ports:
      - "9000:9000"
      - "9001:9001"
    command: -c 'minio server --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  createbuckets:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minio minio123;
      /usr/bin/mc mb myminio/images;
      /usr/bin/mc anonymous set public myminio/images;
      exit 0;
      "

volumes:
  main-db:
  minio-data: